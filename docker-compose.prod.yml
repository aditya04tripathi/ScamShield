name: scamshield

services:
  mongo:
    image: mongo:7
    pull_policy: always
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - backend_internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    pull_policy: always
    restart: unless-stopped
    networks:
      - backend_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    networks:
      - backend_internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend:
    image: ghcr.io/aditya04tripathi/scamshield-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    volumes:
      - backend_data:/app/data
      - shared_tmp:/tmp
    environment:
      PORT: 8000
      DATABASE_URL: sqlite:////app/data/scam_detection.db
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: qwen2.5:0.5b
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/models
      BACKEND_CORS_ORIGINS: '["http://localhost:49153","http://frontend:49153"]'
    networks:
      - backend_internal
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/aditya04tripathi/scamshield:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-49153}:${PORT:-49153}"
    volumes:
      - shared_tmp:/tmp
    environment:
      PORT: ${PORT:-49153}
      HOSTNAME: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/scam_detection
      MICROSERVICE_URL: http://backend:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    networks:
      - backend_internal
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  ollama_data:
  backend_data:
  shared_tmp:

networks:
  backend_internal:
    driver: bridge
    internal: true
