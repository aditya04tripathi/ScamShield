name: Publish Docker Images

on:
  push:
    branches:
      - main
      - staging
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.component }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            image_suffix: ""
            context: .
            dockerfile: Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - component: frontend
            image_suffix: ""
            context: .
            dockerfile: Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - component: backend
            image_suffix: "-backend"
            context: ./backend
            dockerfile: ./backend/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - component: backend
            image_suffix: "-backend"
            context: ./backend
            dockerfile: ./backend/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image name
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY}${{ matrix.image_suffix }}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

  merge:
    name: Merge ${{ matrix.component }} manifest
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            image_suffix: ""
          - component: backend
            image_suffix: "-backend"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image name
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY}${{ matrix.image_suffix }}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$META_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE_NAME:build-${GITHUB_SHA}-amd64" \
            "$IMAGE_NAME:build-${GITHUB_SHA}-arm64"
