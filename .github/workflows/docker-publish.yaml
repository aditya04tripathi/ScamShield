name: Publish Docker Images

on:
  push:
    branches:
      - main
      - staging
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      merge_matrix: ${{ steps.matrix.outputs.merge_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check backend inputs
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          if grep -Eq '^(backend/|docker-compose\.yml|docker-compose\.prod\.yml|\.github/workflows/docker-publish\.yaml)$' <<< "$changed_files"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build matrices
        id: matrix
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
        run: |
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            cat >> "$GITHUB_OUTPUT" <<'EOF'
          build_matrix={"include":[{"component":"frontend","image_suffix":"","context":".","dockerfile":"Dockerfile","platform":"linux/amd64","arch":"amd64","runner":"ubuntu-24.04"},{"component":"frontend","image_suffix":"","context":".","dockerfile":"Dockerfile","platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"},{"component":"backend","image_suffix":"-backend","context":"./backend","dockerfile":"./backend/Dockerfile","platform":"linux/amd64","arch":"amd64","runner":"ubuntu-24.04"},{"component":"backend","image_suffix":"-backend","context":"./backend","dockerfile":"./backend/Dockerfile","platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"}]}
          merge_matrix={"include":[{"component":"frontend","image_suffix":""},{"component":"backend","image_suffix":"-backend"}]}
          EOF
          else
            cat >> "$GITHUB_OUTPUT" <<'EOF'
          build_matrix={"include":[{"component":"frontend","image_suffix":"","context":".","dockerfile":"Dockerfile","platform":"linux/amd64","arch":"amd64","runner":"ubuntu-24.04"},{"component":"frontend","image_suffix":"","context":".","dockerfile":"Dockerfile","platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"}]}
          merge_matrix={"include":[{"component":"frontend","image_suffix":""}]}
          EOF
          fi

  build:
    name: Build ${{ matrix.component }} ${{ matrix.arch }}
    needs: changes
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image name
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY}${{ matrix.image_suffix }}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

  merge:
    name: Merge ${{ matrix.component }} manifest
    needs:
      - changes
      - build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.merge_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image name
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY}${{ matrix.image_suffix }}"
          echo "name=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$META_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE_NAME:build-${GITHUB_SHA}-amd64" \
            "$IMAGE_NAME:build-${GITHUB_SHA}-arm64"
