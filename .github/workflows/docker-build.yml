name: Docker Build & Publish
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      include_arm64:
        description: Also build ARM64 on a native runner
        default: false
        type: boolean
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      image: ${{ steps.matrix.outputs.image }}
    steps:
      - id: matrix
        env:
          REPOSITORY: ${{ github.repository }}
          INCLUDE_ARM64: ${{ inputs.include_arm64 }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$INCLUDE_ARM64" == true ]]; then
            echo 'platforms=[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=[{"arch":"amd64","runner":"ubuntu-latest"}]' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ${{ needs.prepare.outputs.image }}-${{ matrix.service }}:${{ github.sha }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
  publish:
    needs: [prepare, build]
    strategy:
      matrix:
        service: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.prepare.outputs.image }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Publish image manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}-${{ matrix.service }}
          TAGS: ${{ steps.meta.outputs.tags }}
          INCLUDE_ARM64: ${{ inputs.include_arm64 }}
        run: |
          args=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || args+=(-t "$tag")
          done <<< "$TAGS"
          sources=("$IMAGE:$GITHUB_SHA-amd64")
          if [[ "$INCLUDE_ARM64" == true ]]; then
            sources+=("$IMAGE:$GITHUB_SHA-arm64")
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
