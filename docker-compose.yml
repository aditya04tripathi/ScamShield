services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    environment:
      - DATABASE_URL=sqlite:///./scam_detection.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HF_HOME=/app/models
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/scam_detection
      - MICROSERVICE_URL=http://backend:8000
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  mongo_data:
