name: scamshield
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  app:
    image: ${IMAGE_PREFIX:-ghcr.io/aditya04tripathi/scamshield}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/scamshield
      MICROSERVICE_URL: http://backend:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a random JWT_SECRET_KEY in .env}
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/aditya04tripathi/scamshield}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/scam_detection.db
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-granite3.1-moe:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging: *logging
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok || quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
volumes:
  mongo_data:
  backend_data:
